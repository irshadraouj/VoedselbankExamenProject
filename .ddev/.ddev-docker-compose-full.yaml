name: ddev-voedselbankexamenproject
networks:
    ddev_default:
        external: true
        name: ddev_default
    default:
        labels:
            com.ddev.platform: ddev
        name: ddev-voedselbankexamenproject_default
services:
    db:
        build:
            args:
                BASE_IMAGE: ddev/ddev-dbserver-mysql-8.0:v1.24.6
                gid: "20"
                uid: "501"
                username: martijnnieuwenburg
            context: /Users/martijnnieuwenburg/Documents/Coding/Examen/VoedselbankExamenProject/.ddev/.dbimageBuild
            dockerfile: Dockerfile
        cap_add:
            - SYS_NICE
        command: []
        container_name: ddev-VoedselbankExamenProject-db
        environment:
            BITNAMI_VOLUME_DIR: /bitnami/mysql
            COLUMNS: "139"
            DDEV_DATABASE: mysql:8.0
            DDEV_DATABASE_FAMILY: mysql
            DDEV_GOARCH: arm64
            DDEV_GOOS: darwin
            DDEV_HOSTNAME: voedselbankexamenproject.ddev.site
            DDEV_PHP_VERSION: "8.3"
            DDEV_PRIMARY_URL: https://voedselbankexamenproject.ddev.site
            DDEV_PRIMARY_URL_PORT: "443"
            DDEV_PRIMARY_URL_WITHOUT_PORT: https://voedselbankexamenproject.ddev.site
            DDEV_PROJECT: VoedselbankExamenProject
            DDEV_PROJECT_TYPE: php
            DDEV_ROUTER_HTTP_PORT: "80"
            DDEV_ROUTER_HTTPS_PORT: "443"
            DDEV_SCHEME: https
            DDEV_SITENAME: VoedselbankExamenProject
            DDEV_TLD: ddev.site
            DOCKER_IP: 127.0.0.1
            EE_ADMIN_EMAIL: mhjnieuwenburg@gmail.com
            EE_ADMIN_PASSWORD: ""
            EE_ADMIN_USERNAME: Admin
            EE_VERSION: 7.5.6
            HOST_DOCKER_INTERNAL_IP: ""
            IS_DDEV_PROJECT: "true"
            LINES: "18"
            MYSQL_HISTFILE: /mnt/ddev-global-cache/mysqlhistory/VoedselbankExamenProject-db/mysql_history
            NODE_VERSION: "23"
            PGDATABASE: db
            PGHOST: 127.0.0.1
            PGPASSWORD: db
            PGUSER: db
            POSTGRES_DB: db
            POSTGRES_PASSWORD: db
            POSTGRES_USER: db
            TZ: Europe/Amsterdam
            USER: martijnnieuwenburg
        healthcheck:
            interval: 1s
            retries: 70
            start_interval: 1s
            start_period: 4m0s
            timeout: 1m10s
        hostname: VoedselbankExamenProject-db
        image: ddev/ddev-dbserver-mysql-8.0:v1.24.6-VoedselbankExamenProject-built
        labels:
            com.ddev.app-type: php
            com.ddev.approot: /Users/martijnnieuwenburg/Documents/Coding/Examen/VoedselbankExamenProject
            com.ddev.platform: ddev
            com.ddev.site-name: VoedselbankExamenProject
        networks:
            ddev_default: null
            default: null
        ports:
            - host_ip: 127.0.0.1
              mode: ingress
              protocol: tcp
              target: 3306
        restart: "no"
        stop_grace_period: 1m0s
        user: "501:20"
        volumes:
            - source: database
              target: /var/lib/mysql
              type: volume
              volume:
                nocopy: true
            - bind:
                create_host_path: true
              source: /Users/martijnnieuwenburg/Documents/Coding/Examen/VoedselbankExamenProject/.ddev
              target: /mnt/ddev_config
              type: bind
            - bind:
                create_host_path: true
              source: /Users/martijnnieuwenburg/Documents/Coding/Examen/VoedselbankExamenProject/.ddev/db_snapshots
              target: /mnt/snapshots
              type: bind
            - source: ddev-global-cache
              target: /mnt/ddev-global-cache
              type: volume
              volume: {}
        working_dir: /home/martijnnieuwenburg
    phpmyadmin:
        container_name: ddev-VoedselbankExamenProject-phpmyadmin
        depends_on:
            db:
                condition: service_started
                required: true
        environment:
            EE_ADMIN_EMAIL: mhjnieuwenburg@gmail.com
            EE_ADMIN_PASSWORD: ""
            EE_ADMIN_USERNAME: Admin
            EE_VERSION: 7.5.6
            HTTP_EXPOSE: 8036:80
            HTTPS_EXPOSE: 8037:80
            NODE_VERSION: "23"
            PMA_HOST: db
            PMA_PASSWORD: root
            PMA_PORT: "3306"
            PMA_USER: root
            UPLOAD_LIMIT: 4000M
            VIRTUAL_HOST: voedselbankexamenproject.ddev.site
        expose:
            - "80"
        healthcheck:
            interval: 2m0s
            retries: 1
            timeout: 2s
        image: phpmyadmin:5
        labels:
            com.ddev.approot: /Users/martijnnieuwenburg/Documents/Coding/Examen/VoedselbankExamenProject
            com.ddev.site-name: VoedselbankExamenProject
        networks:
            ddev_default: null
            default: null
        restart: "no"
        volumes:
            - bind:
                create_host_path: true
              source: /Users/martijnnieuwenburg/Documents/Coding/Examen/VoedselbankExamenProject/.ddev
              target: /mnt/ddev_config
              type: bind
            - source: ddev-global-cache
              target: /mnt/ddev-global-cache
              type: volume
              volume: {}
        working_dir: /root
    web:
        build:
            args:
                BASE_IMAGE: ddev/ddev-webserver:v1.24.6
                DDEV_DATABASE: mysql:8.0
                DDEV_PHP_VERSION: "8.3"
                gid: "20"
                uid: "501"
                username: martijnnieuwenburg
            context: /Users/martijnnieuwenburg/Documents/Coding/Examen/VoedselbankExamenProject/.ddev/.webimageBuild
            dockerfile: Dockerfile
        cap_add:
            - SYS_PTRACE
        command:
            - /pre-start.sh
        container_name: ddev-VoedselbankExamenProject-web
        environment:
            COLUMNS: "139"
            COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
            COREPACK_HOME: /mnt/ddev-global-cache/corepack
            DDEV_APPROOT: /var/www/html
            DDEV_COMPOSER_ROOT: /var/www/html
            DDEV_DATABASE: mysql:8.0
            DDEV_DATABASE_FAMILY: mysql
            DDEV_DOCROOT: website/public_html
            DDEV_FILES_DIR: ""
            DDEV_FILES_DIRS: ""
            DDEV_GOARCH: arm64
            DDEV_GOOS: darwin
            DDEV_HOSTNAME: voedselbankexamenproject.ddev.site
            DDEV_MUTAGEN_ENABLED: "true"
            DDEV_PHP_VERSION: "8.3"
            DDEV_PRIMARY_URL: https://voedselbankexamenproject.ddev.site
            DDEV_PRIMARY_URL_PORT: "443"
            DDEV_PRIMARY_URL_WITHOUT_PORT: https://voedselbankexamenproject.ddev.site
            DDEV_PROJECT: VoedselbankExamenProject
            DDEV_PROJECT_TYPE: php
            DDEV_ROUTER_HTTP_PORT: "80"
            DDEV_ROUTER_HTTPS_PORT: "443"
            DDEV_SCHEME: https
            DDEV_SITENAME: VoedselbankExamenProject
            DDEV_TLD: ddev.site
            DDEV_VERSION: v1.24.6
            DDEV_WEB_ENTRYPOINT: /mnt/ddev_config/web-entrypoint.d
            DDEV_WEBSERVER_TYPE: apache-fpm
            DDEV_XDEBUG_ENABLED: "false"
            DDEV_XHPROF_MODE: prepend
            DEPLOY_NAME: local
            DOCKER_IP: 127.0.0.1
            DOCROOT: website/public_html
            DRUSH_OPTIONS_URI: https://voedselbankexamenproject.ddev.site
            EE_ADMIN_EMAIL: mhjnieuwenburg@gmail.com
            EE_ADMIN_PASSWORD: ""
            EE_ADMIN_USERNAME: Admin
            EE_VERSION: 7.5.6
            HOST_DOCKER_INTERNAL_IP: ""
            HTTP_EXPOSE: 80:80,8025:8025,5172:5173
            HTTPS_EXPOSE: 443:80,8026:8025,5173:5173
            IS_DDEV_PROJECT: "true"
            LINES: "18"
            MYSQL_HISTFILE: /mnt/ddev-global-cache/mysqlhistory/VoedselbankExamenProject-web/mysql_history
            NODE_EXTRA_CA_CERTS: /mnt/ddev-global-cache/mkcert/rootCA.pem
            NODE_VERSION: "23"
            PGDATABASE: db
            PGHOST: db
            PGPASSWORD: db
            PGUSER: db
            PHP_IDE_CONFIG: serverName=VoedselbankExamenProject.ddev.site
            SSH_AUTH_SOCK: /home/.ssh-agent/socket
            START_SCRIPT_TIMEOUT: "60"
            TZ: Europe/Amsterdam
            USER: martijnnieuwenburg
            VIRTUAL_HOST: voedselbankexamenproject.ddev.site
            npm_config_cache: /mnt/ddev-global-cache/npm
        expose:
            - "5173"
        external_links:
            - ddev-router:voedselbankexamenproject.ddev.site
        healthcheck:
            interval: 1s
            retries: 70
            start_interval: 1s
            start_period: 4m0s
            timeout: 1m10s
        hostname: VoedselbankExamenProject-web
        image: ddev/ddev-webserver:v1.24.6-VoedselbankExamenProject-built
        labels:
            com.ddev.app-type: php
            com.ddev.approot: /Users/martijnnieuwenburg/Documents/Coding/Examen/VoedselbankExamenProject
            com.ddev.platform: ddev
            com.ddev.site-name: VoedselbankExamenProject
        networks:
            ddev_default: null
            default: null
        ports:
            - host_ip: 127.0.0.1
              mode: ingress
              protocol: tcp
              target: 80
            - host_ip: 127.0.0.1
              mode: ingress
              protocol: tcp
              target: 443
            - host_ip: 127.0.0.1
              mode: ingress
              protocol: tcp
              target: 5173
            - host_ip: 127.0.0.1
              mode: ingress
              protocol: tcp
              target: 8025
        restart: "no"
        user: "501:20"
        volumes:
            - source: project_mutagen
              target: /var/www
              type: volume
              volume:
                nocopy: true
            - source: project_mutagen
              target: /tmp/project_mutagen
              type: volume
              volume:
                nocopy: true
            - bind:
                create_host_path: true
              read_only: true
              source: /Users/martijnnieuwenburg/Documents/Coding/Examen/VoedselbankExamenProject/.ddev
              target: /mnt/ddev_config
              type: bind
            - bind:
                create_host_path: true
              source: /Users/martijnnieuwenburg/Documents/Coding/Examen/VoedselbankExamenProject/.ddev/xhprof
              target: /usr/local/bin/xhprof
              type: bind
            - bind:
                create_host_path: true
              source: /Users/martijnnieuwenburg/Documents/Coding/Examen/VoedselbankExamenProject/.git
              target: /var/www/html/.git
              type: bind
            - source: ddev-global-cache
              target: /mnt/ddev-global-cache
              type: volume
              volume: {}
            - source: ddev-ssh-agent_socket_dir
              target: /home/.ssh-agent
              type: volume
              volume: {}
        working_dir: /var/www/html/
    xhgui:
        container_name: ddev-VoedselbankExamenProject-xhgui
        depends_on:
            db:
                condition: service_started
                required: true
        environment:
            DDEV_DATABASE_FAMILY: mysql
            EE_ADMIN_EMAIL: mhjnieuwenburg@gmail.com
            EE_ADMIN_PASSWORD: ""
            EE_ADMIN_USERNAME: Admin
            EE_VERSION: 7.5.6
            HTTP_EXPOSE: 8143:80
            HTTPS_EXPOSE: 8142:80
            NODE_VERSION: "23"
            TZ: Europe/Amsterdam
            VIRTUAL_HOST: voedselbankexamenproject.ddev.site
            XHGUI_PDO_PASS: db
            XHGUI_PDO_USER: db
            XHGUI_SAVE_HANDLER: pdo
        image: ddev/ddev-xhgui:v1.24.6
        labels:
            com.ddev.approot: /Users/martijnnieuwenburg/Documents/Coding/Examen/VoedselbankExamenProject
            com.ddev.site-name: VoedselbankExamenProject
        links:
            - db
        networks:
            ddev_default: null
            default: null
        profiles:
            - xhgui
        restart: "no"
volumes:
    database:
        external: true
        name: VoedselbankExamenProject-mariadb
    ddev-global-cache:
        external: true
        name: ddev-global-cache
    ddev-ssh-agent_socket_dir:
        external: true
        name: ddev-ssh-agent_socket_dir
    project_mutagen:
        external: true
        name: VoedselbankExamenProject_project_mutagen
