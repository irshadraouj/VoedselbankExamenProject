<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Invoeren</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .error { color: red; }
    </style>
</head>
<body>
    <form id="productForm">
        <label for="productName">Productnaam (uniek):</label>
        <input type="text" id="productName" required><br><br>

        <label for="category">Categorie:</label>
        <input type="text" id="category" required><br><br>

        <label for="ean">EAN:</label>
        <input type="text" id="ean" required><br><br>

        <label for="amount">Aantal:</label>
        <input type="number" id="amount" required><br><br>

        <label for="expiry">Houdbaarheid:</label>
        <input type="date" id="expiry" required><br><br>

        <button type="submit">Opslaan</button>
    </form>

    <div id="message" class="error"></div>

    <script>
        document.getElementById('productForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const productName = document.getElementById('productName').value;
            const ean = document.getElementById('ean').value;
            const amount = document.getElementById('amount').value;
            const expiry = document.getElementById('expiry').value;

           // hier is de EAN validatie
            if (!validateEAN(ean)) {
                document.getElementById('message').textContent = 'Ongeldig EAN formaat.';
                return;
            }

            // hier is de unieke productnaam validatie
            const uniqueNames = ['product1', 'product2'];
            if (uniqueNames.includes(productName)) {
                document.getElementById('message').textContent = 'Productnaam moet uniek zijn.';
                return;
            }

         
            const response = await fetch('/api/products', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ productName, category: document.getElementById('category').value, ean, amount, expiry })
            });

            if (response.ok) {
                document.getElementById('message').textContent = 'Product succesvol toegevoegd!';
                document.getElementById('productForm').reset();
            } else {
                document.getElementById('message').textContent = 'Er is een fout opgetreden bij het opslaan.';
            }
        });

        function validateEAN(ean) {
            const eanRegex = /^[0-9]{13}$/; 
            return eanRegex.test(ean);
        }
    </script>
</body>
</html>
