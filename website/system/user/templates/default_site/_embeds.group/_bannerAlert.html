<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Alert Example</title>
    <style>
        .banner_alert {
            border: 2px solid red; 
            padding: 10px; 
            background-color: #ffcccc; 
            margin: 20px 0; 
            border-radius: 5px; 
        }

        .banner_alert__title h3 {
            margin: 0; 
            color: darkred; 
        }

        .banner_alert__content p {
            margin: 5px 0 0; 
        }
    </style>
</head>
<body>

<div class="banner_alert">
    <div class="banner_alert__title">
        <h3>Let op</h3>
    </div>
    <div class="banner_alert__content">
        <p><b>Diepvries- en alcoholproducten zijn niet beschikbaar.</b></p> 
    </div>
</div>

</body>
</html>
