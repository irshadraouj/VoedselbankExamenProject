<script>
    document.getElementById('productForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const productName = document.getElementById('productName').value;
        const category = document.getElementById('category').value;
        const ean = document.getElementById('ean').value;
        const amount = document.getElementById('amount').value;
        const expiry = document.getElementById('expiry').value;

        if (!validateEAN(ean)) {
            document.getElementById('message').textContent = 'Ongeldig EAN formaat.';
            return;
        }

        const isUnique = await checkUniqueProductName(productName);
        if (!isUnique) {
            document.getElementById('message').textContent = 'Productnaam moet uniek zijn.';
            return;
        }

        try {
            const response = await fetch('/api/products', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ productName, category, ean, amount, expiry })
            });

            if (response.ok) {
                document.getElementById('message').textContent = 'Product succesvol toegevoegd!';
                document.getElementById('productForm').reset();
            } else {
                const errorData = await response.json();
                document.getElementById('message').textContent = errorData.message || 'Er is een fout opgetreden bij het opslaan.';
            }
        } catch (error) {
            document.getElementById('message').textContent = 'Netwerkfout, probeer het opnieuw.';
        }
    });

    function validateEAN(ean) {
        const eanRegex = /^[0-9]{13}$/; 
        return eanRegex.test(ean);
    }

    async function checkUniqueProductName(productName) {
        const response = await fetch(`/api/products/check_unique?name=${encodeURIComponent(productName)}`);
        const data = await response.json();
        return data.isUnique; 
    }
</script>
